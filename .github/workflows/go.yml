# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.2'

      - name: Build
        run: go build -v ./cmd/main.go

      - name: Run tests with coverage
        run: |
          echo "Running tests and generating coverage.out"
          go test -coverprofile=coverage.out ./...

          echo "Filtering coverage with .coverignore"
          grep -v -F -f .coverignore coverage.out > filtered.out || true

      - name: Show filtered test coverage
        run: |
          echo "Filtered coverage results:"
          go tool cover -func=filtered.out

      - name: Generate HTML coverage report
        run: |
          go tool cover -html=filtered.out -o coverage.html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: coverage.html
